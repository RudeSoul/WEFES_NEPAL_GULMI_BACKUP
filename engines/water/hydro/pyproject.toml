[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wefes-hydro-engine"
version = "1.0.0"
description = "Autonomous Geospatial & Hydrological Modeling Engine for Nepal Mountainous Catchments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "rasterio>=1.3.0",
    "scipy>=1.8.0",
    "shapely>=2.0.0"
]

[project.scripts]
wefes-hydro = "cli:main"
