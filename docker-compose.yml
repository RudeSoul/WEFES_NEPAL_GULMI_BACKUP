version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: wefes-postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: wefes_nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wefes-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
